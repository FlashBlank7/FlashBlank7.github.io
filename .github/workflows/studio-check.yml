name: Studio checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: python3 scripts/validate-site.py
      - run: pnpm exec wrangler deploy --dry-run --config admin/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: "false"
